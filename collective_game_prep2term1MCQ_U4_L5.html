<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2prep term1 U4 L5 جماعي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Poppins:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #000; color: white; font-family: 'Cairo', sans-serif;
            overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* ----- إدارة المشاهد ----- */
        .scene {
            display: none; width: 100%; height: 100%; justify-content: center; align-items: center;
            position: absolute; top: 0; left: 0; z-index: 10; flex-direction: column;
        }
        .scene.active { display: flex; animation: zoomIn 0.4s ease; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* ----- البطاقات العامة ----- */
        .main-card { 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); 
            width: 90%; max-width: 600px; border-radius: 40px; border: 2px solid red; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); overflow: hidden; text-align: center;
            display: flex; flex-direction: column;
        }

        .quiz-header { 
            padding: 20px; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; 
            justify-content: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        .logo-container { 
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid red; 
            overflow: hidden; background: #000; box-shadow: 0 0 15px red;
            animation: glow-pulse 2s infinite ease-in-out; flex-shrink: 0;
        }
        @keyframes glow-pulse {
            0% { box-shadow: 0 0 5px red; transform: scale(1); }
            50% { box-shadow: 0 0 25px red, 0 0 40px rgba(239, 68, 68, 0.4); transform: scale(1.05); }
            100% { box-shadow: 0 0 5px red; transform: scale(1); }
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        .header-text { text-align: right; }
        .header-text h1 { font-size: clamp(18px, 4vw, 24px); font-weight: 900; color: white; }
        .animated-name {
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: shine 3s linear infinite; font-weight: 900; font-size: 1rem;
        }

        .content-area { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        input[type="text"], input[type="number"] { 
            width: 85%; max-width: 400px; padding: 15px; border-radius: 20px; 
            border: 2px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); 
            color: white; text-align: center; font-size: 1.2rem; outline: none; 
            font-family: 'Cairo', sans-serif;
        }
        input:focus { border-color: red; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        .btn { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; padding: 15px 40px; 
            border: none; border-radius: 20px; font-size: 1.3rem; font-weight: 800; cursor: pointer; 
            transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; font-family: 'Cairo', sans-serif;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.4);
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 75, 43, 0.8); }
        .btn-blue { background: linear-gradient(135deg, #00c6ff, #0072ff); box-shadow: 0 0 15px rgba(0, 114, 255, 0.4); }
        .btn-blue:hover { box-shadow: 0 0 25px rgba(0, 114, 255, 0.8); }

        /* ----- شاشات المعلم ----- */
        .pin-display { font-size: 4rem; font-weight: 900; letter-spacing: 5px; color: #00f3ff; text-shadow: 0 0 20px #00f3ff; margin: 10px 0; }
        .students-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .student-badge { background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3); font-weight: bold; }
        
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .leaderboard-table th, .leaderboard-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .leaderboard-table th { color: #00f3ff; font-weight: 900; }
        .leaderboard-table tr:nth-child(1) td { color: gold; font-weight: bold; font-size: 1.2rem; }
        .leaderboard-table tr:nth-child(2) td { color: silver; font-weight: bold; }
        .leaderboard-table tr:nth-child(3) td { color: #cd7f32; font-weight: bold; }

        /* ----- تصميم اللعبة (سحب وإدراج) ----- */
        #main-box-game {
            width: 95vw; height: 9
