<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past simple & Past Continuous test - مستر إيهاب</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --primary: #6366f1; --purple-glow: #8b5cf6; --success: #10b981;
    --danger: #ef4444; --bg-dark: #020617; --g: #ffb142;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
body { background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: white; position: relative; overflow-x: hidden; }

body.result-mode { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://drive.google.com/thumbnail?id=1yHlVcO1402weXdOCm7Ao6v7cd0mmRffM&sz=w1500') center/cover fixed !important; }

#particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.main-card { 
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); 
    width: 100%; max-width: 900px; border-radius: 40px; 
    border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 50px rgba(99, 102, 241, 0.2); 
    overflow: hidden; position: relative; z-index: 2; margin: 20px 0;
}

.quiz-header { padding: 20px 40px; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }

.logo-container { 
    width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--danger); 
    overflow: hidden; background: #000; box-shadow: 0 0 15px var(--danger);
    animation: glow-pulse 2s infinite ease-in-out;
}
@keyframes glow-pulse {
    0% { box-shadow: 0 0 5px var(--danger); transform: scale(1); }
    50% { box-shadow: 0 0 25px var(--danger), 0 0 40px rgba(239, 68, 68, 0.4); transform: scale(1.05); }
    100% { box-shadow: 0 0 5px var(--danger); transform: scale(1); }
}
.logo-img { width: 100%; height: 100%; object-fit: cover; }

.header-text { text-align: left; }
.header-text h1 { font-size: 1.5rem; font-weight: 900; color: white; }
.animated-name {
    background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: shine 3s linear infinite; font-weight: 900; font-size: 1.1rem;
}
@keyframes shine { to { background-position: 200% center; } }

.progress-section { padding: 15px 40px; background: rgba(0,0,0,0.3); display: none; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #94a3b8; }
.progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #d946ef); transition: width 0.5s ease; }

.question-row { 
    background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 25px; 
    margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); 
    display: flex; flex-direction: column; gap: 15px; direction: ltr;
}
.question-text { font-size: 1.25rem; font-weight: 800; text-align: left; color: #f8fafc; line-height: 1.6; }

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; direction: ltr; margin-top: 10px; }
.option-box { 
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); 
    padding: 15px 20px; border-radius: 18px; cursor: pointer; font-weight: 700; font-size: 1.05rem; 
    color: white; direction: ltr; transition: 0.3s all; text-align: left;
}
.option-box:hover { background: rgba(99, 102, 241, 0.15); transform: translateY(-3px); border-color: var(--primary); }
.option-box.selected { border-color: var(--success); background: rgba(16, 185, 129, 0.2); color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

.btn { 
    background: linear-gradient(135deg, #4f46e5, #9333ea); color: white; padding: 16px 35px; 
    border: none; border-radius: 18px; font-size: 1.2rem; font-weight: 800; cursor: pointer; 
    margin: 10px; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px;
}
.scene { display: none; padding: 40px; text-align: center; }
.active { display: block; animation: zoomIn 0.5s ease; }
@keyframes zoomIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }

input[type="text"].name-input { width: 85%; padding: 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; text-align: center; font-size: 1.3rem; outline: none; margin-bottom: 30px; }
.review-area { background: rgba(0,0,0,0.6); border-radius: 20px; padding: 25px; margin-top: 25px; text-align: left; direction: ltr; display: none; border: 1px solid rgba(255,255,255,0.1); max-height: 400px; overflow-y: auto; }
</style>
</head>
<body oncontextmenu="return false;">

<canvas id="particles-js"></canvas>

<div class="main-card" id="card">
    <div class="quiz-header">
        <div class="logo-container">
            <img src="https://drive.google.com/thumbnail?id=1y4dyG-9kLmoeIaoDev-wFFq5-U8EopB5&sz=w200" class="logo-img">
        </div>
        <div class="header-text">
            <h1 id="header-title">Past simple & Past Continuous test</h1>
            <span class="animated-name">إعداد وبرمجة / أ. إيهاب العدوي</span>
        </div>
    </div>

    <div class="progress-section" id="progressArea">
        <div class="progress-info">
            <span id="progStep">سؤال 1</span>
            <span id="progPercent">0%</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="pBar"></div>
        </div>
    </div>

    <div id="welcome-scene" class="scene active">
        <img src="https://drive.google.com/thumbnail?id=1cF-j-60otMztzK5ruWOGf02aem5WUG7R&sz=w600" style="width: 200px; margin-bottom: 20px;">
        <h2 style="font-size: 1.8rem; margin-bottom: 20px;">اختبار قواعد الماضي البسيط والماضي المستمر</h2>
        <input type="text" id="studentName" class="name-input" placeholder="أدخل اسمك الرباعي يا بطل" autocomplete="off">
        <br>
        <button class="btn" onclick="startTest()">بدء الاختبار <i class="fa-solid fa-bolt"></i></button>
    </div>

    <div id="quiz-scene" class="scene">
        <div id="quiz-content"></div>
        <div style="margin-top: 30px; display: flex; justify-content: space-between;">
            <button class="btn" id="prevBtn" onclick="changePage(-1)" style="background: #334155;">السابق</button>
            <button class="btn" id="nextBtn" onclick="changePage(1)">التالي</button>
        </div>
    </div>

    <div id="result-scene" class="scene">
        <h2 style="font-size: 2.2rem; margin-bottom: 25px; color: var(--success);">تم تسليم الاختبار بنجاح</h2>
        <div id="result-container" style="position:relative; width:100%; max-width:600px; margin: 0 auto 30px;"></div>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;">
            <button class="btn" onclick="toggleReview()" style="background:rgba(255,255,255,0.1)"><i class="fa-solid fa-eye"></i> مراجعة الأخطاء</button>
            <button class="btn" onclick="location.reload()" style="background:rgba(255,255,255,0.05)"><i class="fa-solid fa-rotate"></i> جرب مرة تانية</button>
        </div>
        <div id="reviewArea" class="review-area"></div>
    </div>
</div>

<script>
const EXAM_NAME = "Past simple & Past Continuous test";
const GRADE_LEVEL = "الصف الثالث الإعدادي";
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyI_20IR90uo8GbkEHjFLfeQYPxxierHZeIJBmGERZNJw6wzRd_-pXHL8N1MOhDfc/exec';

document.getElementById("header-title").innerText = EXAM_NAME;

const questionsData = [
    { id: 1, type: "mcq", q: "1. When he came, I was playing tennis. (While)", o: ["While I was playing tennis, he came.", "While he comes, I play.", "While I played, he was coming.", "While he was coming, I played."], a: "While I was playing tennis, he came." },
    { id: 2, type: "mcq", q: "2. We were riding bikes when Ali broke his leg. (As)", o: ["As we were riding bikes, Ali broke his leg.", "As we ride bikes, Ali breaks.", "As we broke bikes, Ali was riding.", "As we were riding, Ali breaks."], a: "As we were riding bikes, Ali broke his leg." },
    { id: 3, type: "mcq", q: "3. I fell asleep. I watched a movie. (While)", o: ["While I was watching a movie, I fell asleep.", "While I fell asleep, I watched.", "While I watch, I fell.", "While I was falling, I watched."], a: "While I was watching a movie, I fell asleep." },
    { id: 4, type: "mcq", q: "4. She walked along the beach. She met her old friend. (When)", o: ["When she was walking along the beach, she met her old friend.", "When she walked, she meets.", "When she meets, she walked.", "When she was meeting, she walked."], a: "When she was walking along the beach, she met her old friend." },
    { id: 5, type: "mcq", q: "5. As I was cycling to school, it rained. (When)", o: ["When it rained, I was cycling to school.", "When I cycled, it rains.", "When it rains, I cycle.", "When I was raining, I cycled."], a: "When it rained, I was cycling to school." },
    { id: 6, type: "mcq", q: "6. She was running when she fell down. (While)", o: ["While she was running, she fell down.", "While she fell, she runs.", "While she runs, she falls.", "While she was falling, she ran."], a: "While she was running, she fell down." },
    { id: 7, type: "mcq", q: "7. The students studied. The fire alarm went off. (As)", o: ["As the students were studying, the fire alarm went off.", "As students study, alarm goes.", "As students went, alarm studies.", "As students were alarm, they studied."], a: "As the students were studying, the fire alarm went off." },
    { id: 8, type: "mcq", q: "8. My mother made the salad. My father came. (When)", o: ["When my father came, my mother was making the salad.", "When father comes, mother makes.", "When mother made, father comes.", "When father was coming, mother made."], a: "When my father came, my mother was making the salad." },
    { id: 9, type: "mcq", q: "9. While she was cooking, she burnt herself. (When)", o: ["When she burnt herself, she was cooking.", "When she cooks, she burns.", "When she was cooking, she burns.", "When she burnt, she cooks."], a: "When she burnt herself, she was cooking." },
    { id: 10, type: "mcq", q: "10. During my flight to Paris, I watched a movie. (While)", o: ["While I was flying to Paris, I watched a movie.", "While I watched, I flew.", "While I fly, I watch.", "While I was flying, I watch."], a: "While I was flying to Paris, I watched a movie." },
    { id: 11, type: "mcq", q: "11. They were playing tennis when it started to rain. (As)", o: ["As they were playing tennis, it started to rain.", "As they play, it rains.", "As it rains, they play.", "As they played, it starts."], a: "As they were playing tennis, it started to rain." },
    { id: 12, type: "mcq", q: "12. We ate dinner. The phone rang. (While)", o: ["While we were eating dinner, the phone rang.", "While we ate, phone rings.", "While phone rang, we eat.", "While we were eating, phone rings."], a: "While we were eating dinner, the phone rang." },
    { id: 13, type: "mcq", q: "13. I read a story. My mum entered. (When)", o: ["When my mum entered, I was reading a story.", "When mum enters, I read.", "When I read, mum enters.", "When mum was entering, I read."], a: "When my mum entered, I was reading a story." },
    { id: 14, type: "mcq", q: "14. He was playing the piano. His mom called. (As)", o: ["As he was playing the piano, his mom called.", "As he plays, mom calls.", "As mom called, he plays.", "As he played, mom calls."], a: "As he was playing the piano, his mom called." },
    { id: 15, type: "mcq", q: "15. She felt worried while she was doing the final exam. (During)", o: ["She felt worried during the final exam.", "She felt worried during she did exam.", "She felt during worried exam.", "She during felt worried."], a: "She felt worried during the final exam." },
    { id: 16, type: "mcq", q: "16. I played football. It started to rain. (While)", o: ["While I was playing football, it started to rain.", "While I played, it starts.", "While it rains, I play.", "While I was playing, it rains."], a: "While I was playing football, it started to rain." },
    { id: 17, type: "mcq", q: "17. He was doing his homework. The doorbell rang. (When)", o: ["When the doorbell rang, he was doing his homework.", "When bell rings, he does.", "When he did, bell rings.", "When bell was ringing, he did."], a: "When the doorbell rang, he was doing his homework." },
    { id: 18, type: "mcq", q: "18. He played an important match yesterday. (at 8:00 yesterday)", o: ["He was playing an important match at 8:00 yesterday.", "He played at 8:00 yesterday.", "He plays at 8:00.", "He is playing at 8:00."], a: "He was playing an important match at 8:00 yesterday." },
    { id: 19, type: "mcq", q: "19. What did you do last night? (at 9:30 last night)", o: ["What were you doing at 9:30 last night?", "What did you do at 9:30?", "What do you do?", "What are you doing?"], a: "What were you doing at 9:30 last night?" },
    { id: 20, type: "mcq", q: "20. My mom cooked in the kitchen. I played video games in my room. (While)", o: ["While my mom was cooking in the kitchen, I was playing video games in my room.", "While mom cooked, I play.", "While mom cooks, I played.", "While mom was cooking, I play."], a: "While my mom was cooking in the kitchen, I was playing video games in my room." },
    { id: 21, type: "mcq", q: "21. I heard a strange noise while I ........ to sleep.", o: ["tried", "was trying", "crying", "tries"], a: "was trying" },
    { id: 22, type: "mcq", q: "22. The students were working quietly when the teacher ........ in.", o: ["was coming", "comes", "coming", "came"], a: "came" },
    { id: 23, type: "mcq", q: "23. She was ........ the dinner when the phone rang.", o: ["cooked", "cooks", "cooking", "cook"], a: "cooking" },
    { id: 24, type: "mcq", q: "24. I ........ my arm while I was riding my bike.", o: ["broke", "breaking", "breaks", "was breaking"], a: "broke" },
    { id: 25, type: "mcq", q: "25. ........ his homework when the phone rang?", o: ["Did he do", "Was he doing", "Does he do", "Is he doing"], a: "Was he doing" },
    { id: 26, type: "mcq", q: "26. What was Samar ........ at 5:00 yesterday?", o: ["did", "do", "doing", "to do"], a: "doing" },
    { id: 27, type: "mcq", q: "27. While ........ in the garden, I felt tired.", o: ["works", "worked", "work", "working"], a: "working" },
    { id: 28, type: "mcq", q: "28. We ........ lunch at 3:00 pm yesterday.", o: ["was eating", "eat", "were eating", "are eating"], a: "were eating" },
    { id: 29, type: "mcq", q: "29. While he was play basketball, he hurt his hand. (Correct: play)", o: ["playing", "played", "plays", "is playing"], a: "playing" },
    { id: 30, type: "mcq", q: "30. The teacher was speaking when a student asks a question. (Correct: asks)", o: ["asked", "asking", "ask", "is asking"], a: "asked" },
    { id: 31, type: "mcq", q: "31. We were waiting at the station while the train to Luxor arrived. (Correct: arrived)", o: ["was arriving", "arrives", "arrive", "arriving"], a: "was arriving" },
    { id: 32, type: "mcq", q: "32. She was cook dinner at 7:00 last night. (Correct: cook)", o: ["cooking", "cooked", "cooks", "is cooking"], a: "cooking" },
    { id: 33, type: "mcq", q: "33. How about go fishing next week? (Correct: go)", o: ["going", "went", "goes", "to go"], a: "going" }
];

let studentName = "";
let currentPage = 0;
let userAnswers = {};
let totalQuestionsCount = 33;
let cheatCount = 0;

document.addEventListener('visibilitychange', () => { if(document.hidden && studentName !== "") cheatCount++; });
window.addEventListener('blur', () => { if(studentName !== "") cheatCount++; });
window.addEventListener('keyup', (e) => { if ((e.key === 'PrintScreen' || e.keyCode === 44) && studentName !== "") cheatCount++; });

function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

let pagesList = [];

function startTest() {
    studentName = document.getElementById('studentName').value.trim();
    if(studentName.split(' ').length < 2) { alert("أدخل اسمك الرباعي يا بطل!"); return; }

    let shuffledMCQ = shuffleArray([...questionsData]);
    shuffledMCQ.forEach(q => { q.o = shuffleArray([...q.o]); });

    pagesList = [];
    for(let i=0; i<shuffledMCQ.length; i+=4) {
        pagesList.push({ type: "mcq_group", items: shuffledMCQ.slice(i, i+4) });
    }

    document.getElementById('progressArea').style.display = "block";
    showScene('quiz-scene');
    renderPage();
}

function renderPage() {
    const box = document.getElementById('quiz-content');
    const pData = pagesList[currentPage];
    
    let solved = countSolved();
    let percent = Math.round((solved / totalQuestionsCount) * 100);
    document.getElementById('pBar').style.width = percent + "%";
    document.getElementById('progStep').innerText = `صفحة ${currentPage + 1} من ${pagesList.length}`;
    document.getElementById('progPercent').innerText = percent + "%";

    let h = "";
    if(pData.type === "mcq_group") {
        pData.items.forEach(q => {
            h += `<div class="question-row">
                    <div class="question-text">${q.q}</div>
                    <div class="options-grid">` + q.o.map(o => `<div class="option-box ${userAnswers[q.id] === o ? 'selected' : ''}" onclick="saveChoice(${q.id}, \`${o}\`)">${o}</div>`).join('') + `</div>
                  </div>`;
        });
    }

    box.innerHTML = h;

    document.getElementById('prevBtn').style.display = (currentPage === 0) ? 'none' : 'inline-flex';
    document.getElementById('nextBtn').innerText = (currentPage === pagesList.length - 1) ? 'تسليم الاختبار' : 'التالي';
}

function countSolved() {
    let count = 0;
    for(let i=1; i<=totalQuestionsCount; i++) {
        if(userAnswers[i] && userAnswers[i].toString().trim() !== "") count++;
    }
    return count;
}

function saveChoice(id, val) {
    userAnswers[id] = val;
    renderPage();
}

function changePage(dir) {
    if(dir === 1) {
        if(currentPage === pagesList.length - 1) {
            let solved = countSolved();
            if(solved < totalQuestionsCount) {
                alert(`عفواً يا بطل! لقد نسيت إجابة ${totalQuestionsCount - solved} أسئلة. يجب حل جميع الأسئلة قبل التسليم.`);
                return;
            }
            if(confirm("هل أنت متأكد من تسليم الاختبار؟")) finishTest();
            return;
        }
        currentPage++;
    } else {
        if(currentPage > 0) currentPage--;
    }
    renderPage();
    window.scrollTo(0,0);
}

function finishTest() {
    showScene('result-scene');
    
    let score = 0;
    let allQsMap = {};
    questionsData.forEach(q => allQsMap[q.id] = { q: q.q, a: q.a });

    let payload = { name: studentName, className: GRADE_LEVEL, examName: EXAM_NAME, cheat: cheatCount };

    for(let i=1; i<=totalQuestionsCount; i++) {
        let ans = (userAnswers[i] || "").toString().trim();
        let correct = allQsMap[i].a.toString().trim();
        let isCorrect = (ans.toLowerCase() === correct.toLowerCase());
        if(isCorrect) score++;
        payload["Q" + i] = { val: ans || "لم يُجب", isCorrect: isCorrect };
    }

    payload.totalScore = score + " / " + totalQuestionsCount;

    if(SCRIPT_URL !== 'YOUR_GOOGLE_SHEET_URL_HERE') {
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }).catch(e => console.log(e));
    }

    const percentage = (score / totalQuestionsCount) * 100;
    const resContainer = document.getElementById('result-container');
    const rev = document.getElementById('reviewArea');

    if (percentage >= 50) {
        confetti({ particleCount: 150, spread: 70 });
        resContainer.innerHTML = `
            <img src="https://drive.google.com/thumbnail?id=1yHlVcO1402weXdOCm7Ao6v7cd0mmRffM&sz=w800" style="width:100%; border-radius:30px;">
            <div style="position:absolute; top:45%; left:50%; transform:translateX(-50%); color:#1e3a8a; font-size:1.8rem; font-weight:900; width:80%;">${studentName}</div>
            <div style="position:absolute; top:60%; left:50%; transform:translateX(-50%); color:#dc2626; font-size:1.4rem; font-weight:900;">الدرجة: ${score} من ${totalQuestionsCount}</div>
        `;
    } else {
        resContainer.innerHTML = `
            <div style="padding:40px; background: rgba(239, 68, 68, 0.1); border:2px solid var(--danger); border-radius:30px;">
                <h3 style="font-size: 2rem; color: var(--danger);">حاول مرة أخرى</h3>
                <p style="font-size: 1.3rem; margin-top: 10px;">يا بطل ${studentName}، درجتك ${score} من ${totalQuestionsCount}.</p>
            </div>
        `;
    }

    let rh = "<h3 style='margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; color:var(--danger);'>مراجعة الأخطاء:</h3>";
    let hasWrong = false;
    for(let i=1; i<=totalQuestionsCount; i++) {
        let ans = (userAnswers[i] || "").toString().trim();
        let correct = allQsMap[i].a.toString().trim();
        if(ans.toLowerCase() !== correct.toLowerCase()) {
            hasWrong = true;
            rh += `<div style="margin:10px 0; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px;">
                    <b>Q:</b> ${allQsMap[i].q}<br>
                    <span style="color:var(--danger)">Your Answer: ${ans || 'No Answer'}</span> | <span style="color:var(--success)">Correct Answer: ${correct}</span>
                   </div>`;
        }
    }
    rev.innerHTML = hasWrong ? rh : "<h3 style='color:var(--success); font-size: 1.5rem; text-align:center;'>درجة كاملة! أحسنت يا بطل ولم تخطئ في أي سؤال 🌟</h3>";
}

function toggleReview() {
    const r = document.getElementById('reviewArea');
    r.style.display = (r.style.display === "none" || r.style.display === "") ? "block" : "none";
}

function showScene(id) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

const canvas = document.getElementById('particles-js');
const ctx = canvas.getContext('2d');
let pts = [];
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
class P {
    constructor() { this.reset(); }
    reset() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.s=Math.random()*2+1; this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5; }
    update() { this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset(); }
    draw() { ctx.fillStyle="rgba(139,92,246,0.3)"; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
}
for(let i=0;i<50;i++) pts.push(new P());
function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p=>{p.update(); p.draw();}); requestAnimationFrame(animate); }
animate();
</script>
</body>
