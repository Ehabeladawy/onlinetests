<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Ehab - 66 Qs on Unit 1+2 - prep2 term1</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --primary: #6366f1; --purple-glow: #8b5cf6; --success: #10b981;
    --danger: #ef4444; --bg-dark: #020617; 
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
body { background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: white; position: relative; overflow-x: hidden; }

#particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.main-card { 
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); 
    width: 100%; max-width: 850px; border-radius: 40px; 
    border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 0 50px rgba(99, 102, 241, 0.2); 
    overflow: hidden; position: relative; z-index: 2; margin: 20px 0;
}

.quiz-header { padding: 20px 40px; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }

.logo-container { 
    width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--danger); 
    overflow: hidden; background: #000; box-shadow: 0 0 15px var(--danger);
    animation: glow-pulse 2s infinite ease-in-out;
}
@keyframes glow-pulse {
    0% { box-shadow: 0 0 5px var(--danger); transform: scale(1); }
    50% { box-shadow: 0 0 25px var(--danger), 0 0 40px rgba(239, 68, 68, 0.4); transform: scale(1.05); }
    100% { box-shadow: 0 0 5px var(--danger); transform: scale(1); }
}
.logo-img { width: 100%; height: 100%; object-fit: cover; }

.header-text { text-align: left; }
.header-text h1 { font-size: 1.6rem; font-weight: 900; color: white; }
.animated-name {
    background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: shine 3s linear infinite; font-weight: 900; font-size: 1.1rem;
}
@keyframes shine { to { background-position: 200% center; } }

.progress-section { padding: 15px 40px; background: rgba(0,0,0,0.3); display: none; }
.progress-info { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #94a3b8; }
.progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #d946ef); transition: width 0.5s ease; }

.question-row { 
    background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 25px; 
    margin-bottom: 30px; border: 1px solid var(--danger); 
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    display: flex; align-items: center; gap: 20px; direction: ltr;
}
.question-text { font-size: 1.4rem; font-weight: 800; text-align: left; flex: 1; color: #f8fafc; line-height: 1.6; }

.timer-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
.timer-svg { transform: rotate(-90deg); width: 80px; height: 80px; }
.timer-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 6; }
.timer-progress { 
    fill: none; stroke: var(--success); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 226; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
#timer-text { position: absolute; font-size: 1.6rem; font-weight: 900; }

.option-box { 
    background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); 
    padding: 18px 25px; border-radius: 18px; cursor: pointer; font-weight: 700; font-size: 1.2rem; 
    margin-bottom: 12px; color: white; width: 100%; direction: ltr; transition: 0.3s all;
    display: flex; justify-content: space-between; align-items: center;
}
.option-box:hover { background: rgba(99, 102, 241, 0.15); transform: translateX(10px); }

.correct { background: var(--success) !important; border-color: #fff !important; }
.wrong { background: var(--danger) !important; border-color: #fff !important; }
.disabled { pointer-events: none; }

.btn { 
    background: linear-gradient(135deg, #4f46e5, #9333ea); color: white; padding: 16px 35px; 
    border: none; border-radius: 18px; font-size: 1.2rem; font-weight: 800; cursor: pointer; 
    margin: 10px; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px;
}
.scene { display: none; padding: 40px; text-align: center; }
.active { display: block; animation: zoomIn 0.5s ease; }
@keyframes zoomIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }

input[type="text"] { width: 85%; padding: 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; text-align: center; font-size: 1.3rem; outline: none; margin-bottom: 30px; }
.review-area { background: rgba(0,0,0,0.4); border-radius: 20px; padding: 25px; margin-top: 25px; text-align: center; display: none; border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>

<canvas id="particles-js"></canvas>

<div class="main-card" id="card">

        <h2 style="font-size: 1.8rem; margin-bottom: 20px;">66 Qs on Unit 1+2 - prep2 term1</h2>

<script>

    { q: "We add the suffix \".........\" to form the noun from \"behave\".", options: ["-ly", "-ous", "-ed", "-ior"], correct: "-ior" },

    { q: "It is important to .......... your time between playing and using your tablet.", options: ["balance", "encourage", "discover", "explore"], correct: "balance" },
    { q: "Mariam was born in 2014. She belongs to Gen ................. .", options: ["Site", "Alpha", "Zoom", "Footprint"], correct: "Alpha" },
    { q: "This generation represents a powerful trend. The word \"powerful\" here is similar in meaning to \"............\".", options: ["lazy", "weak", "effective", "useless"], correct: "effective" },
    { q: "What challenges do new generations face? The word \"challenges\" here means \"............\".", options: ["solutions", "answers", "families", "difficulties"], correct: "difficulties" },

    { q: "Gen Alpha always likes using digital tools ......... their identity.", options: ["decrease", "create", "reduce", "discourage"], correct: "create" },
    { q: "The suffix \".........\" forms the adjective from the word \"digital\".", options: ["-ment", "-ness", "-al", "-ity"], correct: "-al" },
    { q: "Do you ever try to find a ........... between real life and screen time?", options: ["balance", "chat", "health", "permission"], correct: "balance" },
    { q: "A/An ........... is a popular new development, often seen in digital content.", options: ["balance", "trend", "emoji", "skill"], correct: "trend" },
    { q: "Many Gen Alpha children are using .......... to learn about the world.", options: ["social media", "screen time", "digital natives", "memes"], correct: "social media" },
    { q: "You should ........... your screen time. It's good for you.", options: ["limit", "make", "share", "guide"], correct: "limit" },
    { q: "Gen Alpha use technology ............... a very young age.", options: ["with", "by", "for", "from"], correct: "from" },
    { q: "Too much screen time can ........... health and relationships.", options: ["improve", "affect", "guide", "face"], correct: "affect" },
    { q: "Gen Alpha are creative, quick learners, and very ......... .", options: ["personal", "constantly", "adaptive", "artificial"], correct: "adaptive" },
    { q: "Leila tries to ............. her work with her personal life.", options: ["balance", "delete", "express", "kill"], correct: "balance" },
    { q: "A group of people born around the same time are called a ......... .", options: ["generation", "preparation", "presentation", "connection"], correct: "generation" },
    { q: "The antonym of the word \"encourage\" .............. .", options: ["encourage", "discourage", "support", "motivate"], correct: "discourage" },
    { q: "People who cannot hear often use their hands to ............. .", options: ["encourage", "represent", "communicate", "express"], correct: "communicate" },
    { q: "A/An ............. is a person who grew up using technology like computers.", options: ["digital native", "community", "generation", "identity"], correct: "digital native" },
    { q: "My teacher gives us useful advice every day. The synonym of \"useful\" is \".........\".", options: ["useful", "helpful", "strong", "weak"], correct: "helpful" },
    { q: "Good friends connect with each other every day. We add the suffix \"............\" to form the noun of \"connect\".", options: ["ful", "ive", "ity", "ion"], correct: "ion" },
    { q: "My friends share funny .......... on the internet after school.", options: ["screens", "tools", "memes", "machines"], correct: "memes" },
    { q: "Tarek is learning ........... to create websites and apps.", options: ["history", "coding", "medicine", "coloring"], correct: "coding" },
    { q: "Gen Alpha should use social media ............... .", options: ["foolishly", "carelessly", "wisely", "quickly"], correct: "wisely" },
    { q: ".............. intelligence helps people use smart computers.", options: ["connected", "Artificial", "Global", "Worldwide"], correct: "Artificial" },
    { q: "Many students like to ............... short videos with their phones.", options: ["create", "balance", "solve", "do"], correct: "create" },
    { q: "Many students use online ............. to learn new lessons.", options: ["backgrounds", "pillows", "suitcases", "platforms"], correct: "platforms" },
    { q: "Funny pictures and videos that spread quickly on the internet are called ............... .", options: ["memes", "emails", "poems", "stories"], correct: "memes" },
    { q: "Small digital images or icons used to express ideas or emotions are called ............ .", options: ["poems", "emails", "emojis", "stories"], correct: "emojis" },
    { q: "She wears the latest fashion dresses. The synonym of \"latest\" is ........... .", options: ["oldest", "cheapest", "newest", "worst"], correct: "newest" },
    { q: "Children should limit their screen time. The antonym of \"limit\" is ......... .", options: ["control", "grow", "increase", "reduce"], correct: "increase" },
    { q: "To form the adjective of the word \"digit\", we add the suffix ......... .", options: ["-ion", "-ive", "-ful", "-al"], correct: "-al" },
    { q: "We add the suffix \"...........\" to the word \"power\" to form the adjective.", options: ["-ion", "-ive", "-ful", "-al"], correct: "-ful" },
    { q: "We can form the adjective from \"create\" when we add the suffix \"............\".", options: ["-al", "-able", "-or", "-ive"], correct: "-ive" },
    { q: "Doctors say too much ........... can be bad for your eyes.", options: ["bedtime", "screen time", "free time", "spare time"], correct: "screen time" },
    { q: "Learning ........... helps Rana create apps and websites.", options: ["cooking", "drawing", "reading", "coding"], correct: "coding" },
    { q: "Your words didn't encourage me. They ........... me.", options: ["discouraged", "helped", "supported", "motivated"], correct: "discouraged" },
    { q: "\"...........\" means a situation in which different things are of equal or proper weight or amount.", options: ["Damage", "Disorder", "fight", "Balance"], correct: "Balance" },

    { q: "Too much screen time can affect health and relationships badly. This means it has a/an ............. effect.", options: ["positive", "negative", "useful", "active"], correct: "negative" },
    { q: "What challenges did you ............. to reach your goal?", options: ["share", "face", "create", "express"], correct: "face" },
    { q: "Parents want their children to ............. their screen time.", options: ["increase", "rise", "limit", "double"], correct: "limit" },
    { q: "The words \"online\" and \"connected\" are \"..................\"..", options: ["synonyms", "opposites", "antonyms", "adverbs"], correct: "synonyms" },
    { q: "\"Modern\" and \"...........\" are antonyms.", options: ["recent", "new", "traditional", "current"], correct: "traditional" },
    { q: "The suffix \"-ful\" turns the noun into a/an \"..............\".", options: ["adverb", "adjective", "noun", "pronoun"], correct: "adjective" },
    { q: "It is normal to make mistakes when you learn something new. The synonym of \"normal\" is \"...............\".", options: ["abnormal", "ordinary", "old", "young"], correct: "ordinary" },
    { q: "Which generation includes children born after 2010? ............... .", options: ["Gen Z", "Gen X", "Gen second", "Gen Alpha"], correct: "Gen Alpha" },
    { q: "Many kids use ............ when they chat with their friends online.", options: ["emojis", "books", "songs", "coding"], correct: "emojis" },
    { q: "Too much ............... can make your eyes tired and weak.", options: ["help", "eating", "screen", "sleep"], correct: "screen" },
    { q: "Remas uses .......... to share photos and watch videos.", options: ["books", "social media", "newspaper", "trends"], correct: "social media" },
    { q: "We use .......... every day for learning, playing, and communication.", options: ["technology", "TV", "matches", "trains"], correct: "technology" },
    { q: "Your ........... shows who you are and what makes you special.", options: ["school", "identity", "term", "app"], correct: "identity" },
    { q: "I always ............. how birds can fly so high in the sky .", options: ["wonder", "wander", "play", "eat"], correct: "wonder" },
    { q: "Your identity is ............... you are.", options: ["where", "when", "who", "whose"], correct: "who" }
];

let shuffled = [], currentIdx = 0, score = 0, name = "", timer, timeLeft = 60, wrongs = [];

function startTest() {
    name = document.getElementById('studentName').value.trim();
    if(name.length < 3) return alert("الاسم الثلاثي يا بطل!");
    shuffled = [...quizData]; // All 66 questions
    document.getElementById('progressArea').style.display = "block";
    showScene('quiz-scene');
    loadQuestion();
}

function loadQuestion() {
    clearInterval(timer);
    timeLeft = 60;
    const q = shuffled[currentIdx];
    const p = (currentIdx / shuffled.length) * 100;
    document.getElementById('pBar').style.width = p + "%";
    document.getElementById('progStep').innerText = `سؤال ${currentIdx + 1} من ${shuffled.length}`;
    document.getElementById('progPercent').innerText = Math.round(p) + "%";

    document.getElementById('quiz-scene').innerHTML = `
        <div class="question-row">
            <div class="question-text">${q.q}</div>
            <div class="timer-wrapper">
                <svg class="timer-svg" viewBox="0 0 80 80">
                    <circle class="timer-bg" cx="40" cy="40" r="36"></circle>
                    <circle id="timerRing" class="timer-progress" cx="40" cy="40" r="36"></circle>
                </svg>
                <div id="timer-text">60</div>
            </div>
        </div>
        <div id="optionsGrid"></div>
    `;

    let currentOptions = [...q.options];
    currentOptions.forEach((optText) => {
        const div = document.createElement('div');
        div.className = "option-box";
        div.innerHTML = `<span>${optText}</span>`;
        div.onclick = () => check(div, optText === q.correct);
        document.getElementById('optionsGrid').appendChild(div);
    });
    startTimer();
}

function startTimer() {
    const tText = document.getElementById('timer-text');
    const ring = document.getElementById('timerRing');
    timer = setInterval(() => {
        timeLeft--;
        tText.innerText = timeLeft;
        let offset = 226 - (timeLeft * (226 / 60));
        ring.style.strokeDashoffset = offset;
        if(timeLeft <= 0) { clearInterval(timer); check(null, false); }
    }, 1000);
}

function check(el, isCorrect) {
    clearInterval(timer);
    document.querySelectorAll('.option-box').forEach(b => b.classList.add('disabled'));
    const q = shuffled[currentIdx];

    if(el) {
        if(isCorrect) {
            el.classList.add('correct');
            document.getElementById('sound-correct').play();
            score++;
        } else {
            el.classList.add('wrong');
            document.getElementById('sound-wrong').play();
            wrongs.push({q: q.q, a: q.correct});
            highlightCorrect(q.correct);
        }
    } else {
        wrongs.push({q: q.q, a: q.correct});
        highlightCorrect(q.correct);
    }

    setTimeout(() => {
        currentIdx++;
        if(currentIdx < shuffled.length) loadQuestion(); else finish();
    }, 1500); 
}

function highlightCorrect(correctText) {
    document.querySelectorAll('.option-box').forEach(b => {
        if(b.innerText.trim() === correctText) {
            b.style.borderColor = "var(--success)";
            b.style.borderWidth = "3px";
            b.style.boxShadow = "0 0 20px var(--success)";
            b.querySelector('span').style.color = "var(--success)";
            b.querySelector('span').innerHTML += " <i class='fa-solid fa-check-circle'></i>";
        }
    });
}

function finish() {
    document.getElementById('progressArea').style.display = "none";
    showScene('result-scene');
    const percentage = (score / shuffled.length) * 100;
    const resContainer = document.getElementById('result-container');
    const rev = document.getElementById('reviewArea');

    if (percentage >= 50) {
        confetti({ particleCount: 150, spread: 60 });
        resContainer.innerHTML = `
            <img src="https://drive.google.com/thumbnail?id=1yHlVcO1402weXdOCm7Ao6v7cd0mmRffM&sz=w800" style="width:100%; border-radius:30px;">
            <div style="position:absolute; top:45%; left:50%; transform:translateX(-50%); color:#1e3a8a; font-size:1.8rem; font-weight:900; width:80%;">${name}</div>
            <div style="position:absolute; top:60%; left:50%; transform:translateX(-50%); color:#dc2626; font-size:1.4rem; font-weight:900;">الدرجة: ${score} من ${shuffled.length}</div>
        `;
    } else {
        resContainer.innerHTML = `
            <div style="padding:60px; background: rgba(239, 68, 68, 0.1); border:2px solid var(--danger); border-radius:30px; margin-bottom: 20px;">
                <h3 style="font-size: 2rem; color: var(--danger);">حاول مرة أخرى</h3>
                <p style="font-size: 1.3rem; margin-top: 10px;">يا بطل ${name}، درجتك ${score} من ${shuffled.length}.</p>
            </div>
        `;
    }

    if (wrongs.length === 0) {
        rev.innerHTML = `<h3 style="color:var(--success); font-size: 1.8rem;">ممتاز يا بطل! مفيش أخطاء 🌟</h3>`;
    } else {
        rev.innerHTML = "<h3 style='margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;'>الأخطاء:</h3>";
        wrongs.forEach(w => rev.innerHTML += `<div style="margin:10px 0; padding:15px; background:rgba(255,255,255,0.05); border-radius:15px; text-align:right;">السؤال: ${w.q}<br><span style="color:var(--success)">الإجابة الصح: ${w.a}</span></div>`);
    }
}

function toggleReview() {
    const r = document.getElementById('reviewArea');
    r.style.display = (r.style.display === "none" || r.style.display === "") ? "block" : "none";
}

function showScene(id) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

const canvas = document.getElementById('particles-js');
const ctx = canvas.getContext('2d');
let pts = [];
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
class P {
    constructor() { this.reset(); }
    reset() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.s=Math.random()*2+1; this.vx=(Math.random()-0.5)*0.5; this.vy=(Math.random()-0.5)*0.5; }
    update() { this.x+=this.vx; this.y+=this.vy; if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset(); }
    draw() { ctx.fillStyle="rgba(139,92,246,0.3)"; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
}
for(let i=0;i<50;i++) pts.push(new P());
function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); pts.forEach(p=>{p.update(); p.draw();}); requestAnimationFrame(animate); }
animate();
</script>
</body>
